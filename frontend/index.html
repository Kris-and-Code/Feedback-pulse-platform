<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback-Pulse</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Feedback-Pulse</h1>

    <!-- URL Input Section -->
    <div>
      <h2>Analyze from URL</h2>
      <input type="text" id="url-input" placeholder="Enter URL">
      <button id="analyze-url-btn">Analyze</button>
    </div>

    <!-- CSV Input Section -->
    <div>
      <h2>Upload CSV</h2>
      <input type="file" id="csv-input">
      <button id="analyze-csv-btn">Upload</button>
    </div>

    <!-- Results Section -->
    <div id="results-container" style="display: none;">
      <h2>Results</h2>
      <div id="product-info"></div>
      <div id="aggregate-info"></div>
      <ul id="review-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

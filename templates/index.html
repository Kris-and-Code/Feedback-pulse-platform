<!DOCTYPE html>
<html>
<head>
    <title>Review Analyzer</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/js/main.js"></script>
</head>
<body>
    <div class="container">
        <!-- URL Form -->
        <form id="urlForm">
            <input type="url" id="urlInput" required>
            <button type="submit">Analyze URL</button>
        </form>

        <!-- CSV Form -->
        <form id="csvForm">
            <input type="file" id="csvInput" accept=".csv" required>
            <button type="submit">Analyze CSV</button>
        </form>

        <!-- Progress Bar -->
        <div id="progressBar" style="display: none;">
            Processing...
        </div>

        <!-- Results Section -->
        <div id="results" style="display: none;">
            <div id="productInfo"></div>
            <div id="aggregateInfo">
                <div id="averageRating"></div>
                <div id="sentimentDistribution"></div>
                <div id="emotionDistribution"></div>
            </div>
            <div id="reviewsList"></div>
        </div>
    </div>
</body>
</html>
